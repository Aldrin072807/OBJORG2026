{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Contact Me</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --accent-blue: #17a2b8;
            --bg-primary: #1e293b;
            --bg-secondary: #0f172a;
        }

        body {
            padding-top: 100px;
            background-color: var(--bg-secondary);
            color: #f8fafc;
            min-height: 100vh;
        }

        .section-banner-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            position: relative;
            padding-bottom: 12px;
            display: inline-block;
        }

        .section-banner-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 4px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .form-card {
            background-color: var(--bg-primary);
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .btn-custom {
            background-color: #17a2b8;
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
        }

        .btn-custom:hover {
            background-color: #138496;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="{% url 'portfolio:home' %}">MY PROFILE</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
                Menu <i class="fas fa-bars ml-1"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto text-center">
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:home' %}">HOME</a></li>
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:project_list' %}">PROJECTS</a></li>
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:personal_info' %}">PERSONAL INFO</a></li>
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:testimony_list' %}">TESTIMONIALS</a></li>
                    <li class="nav-item active"><a class="nav-link py-3 px-3" href="{% url 'portfolio:contact' %}">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="section-banner-title text-white text-uppercase">INQUIRE / CONTACT ME</h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card p-4 p-md-5">
                    <!-- Raw HTML Form for Quiz 3 Requirement -->
                    <form method="POST" action="{% url 'portfolio:contact' %}">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold text-info">First Name</label>
                                <input type="text" name="first_name" class="form-control" required placeholder="Aldrin">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold text-info">Last Name</label>
                                <input type="text" name="last_name" class="form-control" required placeholder="Desepeda">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold text-info">Contact Number</label>
                                <input type="text" name="contact_number" class="form-control" required placeholder="09xx-xxx-xxxx">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label class="font-weight-bold text-info">Email Address</label>
                                <input type="email" name="email" class="form-control" required placeholder="al.desepeda@example.com">
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="font-weight-bold text-info">Address</label>
                            <input type="text" name="address" class="form-control" required placeholder="City, Province">
                        </div>

                        <div class="form-group mb-4">
                            <label class="font-weight-bold text-info">Message / Inquiry</label>
                            <textarea name="message" class="form-control" rows="4" required placeholder="How can I help you?"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-custom btn-block btn-lg font-weight-bold">
                                <i class="fas fa-paper-plane mr-2"></i>Send Inquiry
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
