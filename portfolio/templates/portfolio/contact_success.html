{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inquiry Submitted</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --sand-light: #E3DCD2;
            --accent-tan: #CC8B65;
            --bg-primary: #013328;
            --bg-dark: #100C0D;
        }

        body {
            padding-top: 120px;
            background-color: var(--bg-dark);
            color: var(--sand-light);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        h2, .btn-custom {
            font-family: 'Cinzel', serif;
        }

        .card {
            background-color: var(--bg-primary);
            border: 1px solid #154539;
            border-radius: 12px;
        }

        .btn-custom {
            background-color: var(--accent-tan);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
        }

        .btn-custom:hover {
            background-color: #b87853;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-5">
                    <i class="fas fa-check-circle fa-5x mb-4" style="color: var(--accent-tan);"></i>
                    <h2 class="font-weight-bold mb-3 text-white">Thank You!</h2>
                    <p class="lead mb-4">Your inquiry has been submitted successfully. I will get back to you soon.</p>
                    <a href="{% url 'portfolio:home' %}" class="btn btn-custom font-weight-bold">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
