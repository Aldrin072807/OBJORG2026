{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Sign In</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <style>
        :root {
            --sand-light: #E3DCD2;
            --accent-tan: #CC8B65;
            --bg-primary: #013328;
            --bg-dark: #100C0D;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--sand-light);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2, .btn-custom {
            font-family: 'Cinzel', serif;
        }

        .login-card {
            background-color: var(--bg-primary);
            border: 1px solid #154539;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
        }

        .btn-custom {
            background-color: var(--accent-tan);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
        }

        .btn-custom:hover {
            background-color: #b87853;
            color: #ffffff;
        }

        label {
            color: var(--accent-tan);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="text-white text-uppercase font-weight-bold">ADMIN SIGN IN</h2>
            <p class="small text-muted mb-0">Superuser Authentication Only</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 px-3 small" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label>Username</label>
                {{ form.username }}
            </div>
            <div class="form-group mb-4">
                <label>Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-custom btn-block btn-lg">Sign In</button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'portfolio:home' %}" class="small text-muted">← Back to Portfolio</a>
        </div>
    </div>
</body>
</html>
