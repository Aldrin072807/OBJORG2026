{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>My Projects</title>
    
    <!-- Bootstrap 4 CSS CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <!-- Font Awesome icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --accent-blue: #17a2b8;
            --bg-primary: #1e293b;
            --bg-secondary: #0f172a;
        }

        body {
            padding-top: 100px;
            background-color: var(--bg-secondary);
            color: #f8fafc;
            min-height: 100vh;
        }

        .section-banner-title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            position: relative;
            padding-bottom: 12px;
            display: inline-block;
        }

        .section-banner-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 4px;
            background-color: var(--accent-blue);
            border-radius: 2px;
        }

        .project-card {
            background-color: var(--bg-primary);
            border: 1px solid #334155;
            border-radius: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .project-link {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            text-decoration: none;
        }

        .project-link:hover {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .btn-custom {
            background-color: #17a2b8;
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
        }

        .btn-custom:hover {
            background-color: #138496;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="{% url 'portfolio:home' %}">MY PROFILE</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
                Menu <i class="fas fa-bars ml-1"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto text-center">
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:home' %}">HOME</a></li>
                    <li class="nav-item active"><a class="nav-link py-3 px-3" href="{% url 'portfolio:project_list' %}">PROJECTS</a></li>
                    <li class="nav-item"><a class="nav-link py-3 px-3" href="{% url 'portfolio:personal_info' %}">PERSONAL INFO</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container text-center my-5">
        <h1 class="section-banner-title text-white text-uppercase mb-5">MY PROJECTS</h1>
        
        <div class="row justify-content-center">
            {% for project in projects %}
                <div class="col-md-8 col-lg-6 mb-4">
                    <div class="card project-card p-4 text-center">
                        <i class="fas fa-folder-open fa-3x text-info mb-3"></i>
                        <a href="{% url 'portfolio:project_detail' project.id %}" class="project-link">
                            {{ project.project_name }}
                        </a>
                    </div>
                </div>
            {% empty %}
                <div class="col-12">
                    <p class="lead text-muted">No projects found in database.</p>
                </div>
            {% endfor %}
        </div>

        <div class="mt-4">
            <a href="{% url 'portfolio:home' %}" class="btn btn-custom">
                <i class="fas fa-arrow-left mr-2"></i>Back to Home
            </a>
        </div>
    </div>

</body>
</html>
